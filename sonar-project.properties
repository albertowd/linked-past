sonar.projectKey=linked-past
sonar.projectName=Linked Past
sonar.sourceEncoding=UTF-8
# Not a git repository yet; drop this once it is so new-code detection uses history.
sonar.scm.disabled=true

# Product code, infrastructure, scripts and container files.
sonar.sources=src,scripts,emulator/Dockerfile,emulator/Makefile,docker-compose.yml
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/dist/**,**/test/**,**/coverage/**,\
  public/core/**,src/shared/data/**
sonar.test.inclusions=**/test/**/*.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Entry points and browser glue exercised end-to-end (Playwright) rather than by unit tests.
sonar.coverage.exclusions=src/main.ts,src/ui/game.ts,src/ui/start.ts,src/ui/controls.ts,\
  src/emu/core.ts,src/emu/audio.ts,src/emu/input.ts,src/game/session.ts,src/game/overlay.ts,src/net/host.ts,src/net/guest.ts,src/net/hostWorker.ts,src/net/link.ts,src/ui/invite.ts,src/rom/**,\
  scripts/**,vite.config.ts
